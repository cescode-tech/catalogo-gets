        function loadData() {
            catalogsData = catalogsData_embedded;
            renderCategories();
        }

        function formatCurrency(value) {
            return new Intl.NumberFormat('es-CO', {
                style: 'currency',
                currency: 'COP',
                minimumFractionDigits: 0
            }).format(value);
        }

        function getProductType(categoryName) {
            if (categoryName.toLowerCase().includes('amparados') || categoryName.toLowerCase().includes('iphone')) {
                return 'iphone';
            } else if (categoryName.toLowerCase().includes('televisor')) {
                return 'tv';
            } else {
                return 'android';
            }
        }

        function getProductIcon(categoryName) {
            if (categoryName.toLowerCase().includes('televisor')) {
                return '<i class="fas fa-tv"></i>';
            } else if (categoryName.toLowerCase().includes('iphone') || categoryName.toLowerCase().includes('amparados') || categoryName.toLowerCase().includes('ipad')) {
                return '<i class="fab fa-apple"></i>';
            } else if (categoryName.toLowerCase().includes('androide') || categoryName.toLowerCase().includes('android')) {
                return '<i class="fab fa-android"></i>';
            } else {
                return '<i class="fas fa-mobile-alt"></i>';
            }
        }

        function renderCategories() {
            const grid = document.getElementById('categoriesGrid');
            grid.innerHTML = '';

            const categoryOrder = [
                "Amparados iPhone",
                "iPhone con Cuota Inicial",
                "Androide con Cuota Inicial",
                "Televisores con Cuota Inicial"
            ];

            categoryOrder.forEach(categoryName => {
                const categoryData = catalogsData[categoryName];
                if (!categoryData) return;

                const productsCount = categoryData.productos ? categoryData.productos.length : 0;
                const quincenas = categoryData.quincenas || '?';

                const card = document.createElement('div');
                card.className = 'category-card';
                card.setAttribute('data-category', categoryName);
                card.innerHTML = `
                    <div class="category-icon">
                        ${getProductIcon(categoryName)}
                    </div>
                    <div class="category-info">
                        <div class="category-name">${categoryName}</div>
                        <div class="category-count">
                            <span><i class="fas fa-box"></i> <strong>${productsCount}</strong> productos</span>
                            <span class="category-count-badge"><i class="fas fa-hourglass-half"></i> ${quincenas}Q</span>
                        </div>
                        <button class="btn-view" onclick="viewCategory('${categoryName}')">
                            <i class="fas fa-arrow-right"></i> Ver Catálogo
                        </button>
                    </div>
                `;
                grid.appendChild(card);
            });
        }

        function renderBenefits(categoryData) {
            const benefitsSection = document.getElementById('benefitsSection');

            if (!categoryData.beneficios || categoryData.beneficios.length === 0) {
                benefitsSection.innerHTML = '';
                return;
            }

            const benefitsHTML = categoryData.beneficios.map((benefit, idx) => {
                const isHighlight = benefit.includes('50%');
                return `<span class="benefit-badge ${isHighlight ? 'highlight' : ''}">
                    <i class="fas fa-check-circle"></i> ${benefit}
                </span>`;
            }).join('');

            benefitsSection.innerHTML = `
                <div class="benefits-title"><i class="fas fa-star"></i> Beneficios de este plan</div>
                <div class="benefits-list">${benefitsHTML}</div>
            `;
        }

        function viewCategory(categoryName) {
            currentCategory = categoryName;
            const categoryData = catalogsData[categoryName] || {};
            allProducts = categoryData.productos || [];

            document.getElementById('categoriesView').classList.remove('active');
            document.getElementById('catalogView').classList.add('active');
            document.getElementById('catalogTitle').textContent = categoryName;
            document.getElementById('searchInput').value = '';

            renderBenefits(categoryData);
            renderProducts(allProducts);
        }

        function getBadgeClass(quincenas) {
            if (quincenas === 16) return 'badge-16';
            if (quincenas === 12) return 'badge-initial';
            return '';
        }

        function renderProducts(products) {
            const tbody = document.getElementById('productsBody');
            const emptyState = document.getElementById('emptyState');
            const table = document.getElementById('productsTable');

            if (products.length === 0) {
                tbody.innerHTML = '';
                emptyState.style.display = 'block';
                table.style.display = 'none';
                return;
            }

            emptyState.style.display = 'none';
            table.style.display = 'table';

            tbody.innerHTML = products.map(product => {
                const badgeClass = getBadgeClass(product.quincenas);
                return `
                    <tr>
                        <td class="product-name-cell">
                            ${product.nombre}
                        </td>
                        <td class="amount-cell">${formatCurrency(product.monto)}</td>
                        <td class="quota-cell">${formatCurrency(product.cuota)}</td>
                        <td>
                            <span class="quincenas-badge ${badgeClass}">
                                ${product.quincenas}Q
                            </span>
                        </td>
                    </tr>
                `;
            }).join('');
        }

        function filterProducts() {
            const searchTerm = document.getElementById('searchInput').value.toLowerCase();
            const filtered = allProducts.filter(product =>
                product.nombre.toLowerCase().includes(searchTerm)
            );
            renderProducts(filtered);
        }

        function goBack() {
            currentCategory = null;
            allProducts = [];
            document.getElementById('catalogView').classList.remove('active');
            document.getElementById('categoriesView').classList.add('active');
        }

        loadData();
    </script>
