        const MARCAS = [['iphone','Apple'],['ipad','Apple'],['honor','Honor'],['infinix','Infinix'],
            ['kalley','Kalley'],['moto','Motorola'],['oppo','Oppo'],['redmi','Xiaomi'],['xiaomi','Xiaomi'],
            ['xioami','Xiaomi'],['samsung','Samsung'],['tecno','Tecno'],['vivo','Vivo'],['zte','ZTE'],['tcl','TCL']];

        function grupoDe(p) {
            return p.grupo || 'Equipos';
        }

        function valorBase(p) { return p.tipo === 'contado' ? p.precio : (p.tipo === 'sin_inicial' ? p.monto : p.inicial); }

        function agrupar(products) {
            const g = {};
            products.forEach(p => { const k = grupoDe(p); (g[k] = g[k] || []).push(p); });
            const esAccesorio = p => /accesorio|cable|cubo|cargador/i.test(p.nombre);
            Object.values(g).forEach(arr => arr.sort((a, b) =>
                (esAccesorio(a) - esAccesorio(b)) || (valorBase(a) - valorBase(b))));
            const orden = ["Samsung", "Teléfonos Económicos", "ZTE / Nubia", "Xiaomi / Redmi", "Honor", "Motorola", "Tecno", "Infinix", "Vivo", "Oppo", "Tablets", "iPhone Usado", "Apple Watch", "Patinetas y Movilidad", "Sonido Premium", "iPad", "iPhone Nuevo", "MacBook", "Apple - Accesorios", "Gaming, Tecnología y Accesorios"];
            return Object.keys(g)
                .sort((a, b) => orden.indexOf(a) - orden.indexOf(b))
                .map(k => [k, g[k]]);
        }

        function slug(nombre) {
            return nombre.toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g, '')
                .replace(/["']/g, '').replace(/[^a-z0-9]+/g, '-').replace(/^-|-$/g, '');
        }

        // El nombre de la foto sale del equipo fisico, no del SKU: un iPhone 17 Pro Max
        // se ve igual con 256 o 512 GB, nuevo o usado. Asi una sola foto sirve para
        // todas sus variantes y para todos los catalogos.
        function slugFoto(nombre) {
            // Quita almacenamiento, RAM y estado. El Excel los escribe de varias
            // formas ("128GB 4GB RAM", "128GB/4RAM", "4GB/128GB", "256GB/12+12RAM"),
            // y todas deben llegar al mismo nombre de archivo para compartir la foto.
            return slug(nombre.replace(/\s*[\d+]+\s*(GB|TB)\b/gi, ' ')
                              .replace(/\s*[\d+]+\s*RAM\b/gi, ' ')
                              .replace(/[\/+]/g, ' ')
                              .replace(/\s*\b(Nuevo|Usado)\b/gi, ' ')
                              .trim());
        }

        // Carpeta unica de imagenes en la raiz del repositorio. Funciona igual desde
        // la raiz o desde cualquier subcarpeta (/amparados/, /contado/, ...).
        const IMG_BASE = location.pathname.split('/')[1]
            ? '/' + location.pathname.split('/')[1] + '/img/'
            : 'img/';

        let visibles = [];
        let fotoActual = 0;
        let fotosOk = [];

        function mostrarFoto(i) {
            fotoActual = (i + fotosOk.length) % fotosOk.length;
            const img = document.getElementById('carImg');
            if (img) img.src = fotosOk[fotoActual];
            document.querySelectorAll('.car-dot').forEach((d, k) => d.className = 'car-dot' + (k === fotoActual ? ' on' : ''));
        }

        function abrirFicha(idx) {
            const p = visibles[idx];
            if (!p) return;
            const s = slugFoto(p.nombre);
            const etiqueta = 'Precio Contado';

            let specsHTML = '<div class="specs-pend">Características por confirmar</div>';
            if (p.specs && Object.keys(p.specs).length) {
                specsHTML = '<table class="specs">' + Object.entries(p.specs)
                    .map(([k, v]) => `<tr><td>${k}</td><td>${v}</td></tr>`).join('') + '</table>';
            }

            document.getElementById('modalBox').innerHTML = `
                <button class="modal-close" onclick="cerrarFicha()" aria-label="Cerrar">&times;</button>
                <h2>${p.nombre}</h2>
                <div class="modal-cat">${p.grupo}${p.estado ? ' · ' + p.estado : ''}</div>
                <div id="fotoZona"><div class="no-photo"><span>📷</span><span>Fotos pendientes</span></div></div>
                <div class="modal-money">
                    <div class="money-card"><div class="lbl">${etiqueta}</div><div class="val">${formatCurrency(p.precio)}</div></div>
                </div>
                <div class="specs-title">Características</div>
                ${specsHTML}`;

            document.getElementById('modalBg').classList.add('open');
            document.body.style.overflow = 'hidden';

            fotosOk = [];
            const EXT = ['jpg', 'jpeg', 'png', 'webp', 'JPG', 'PNG'];
            const hallazgos = {};
            let faltan = 3;

            function slotListo() {
                if (--faltan) return;
                fotosOk = [1, 2, 3].map(n => hallazgos[n]).filter(Boolean);
                pintarCarrusel();
            }

            [1, 2, 3].forEach(n => {
                let e = 0;
                (function probar() {
                    if (e >= EXT.length) return slotListo();
                    const ruta = `${IMG_BASE}${s}-${n}.${EXT[e++]}`;
                    const test = new Image();
                    test.onload = () => { hallazgos[n] = ruta; slotListo(); };
                    test.onerror = probar;
                    test.src = ruta;
                })();
            });
        }

        function pintarCarrusel() {
            if (!fotosOk.length) return;
            const zona = document.getElementById('fotoZona');
            if (!zona) return;
            const flechas = fotosOk.length > 1
                ? '<button class="car-btn car-prev" onclick="mostrarFoto(fotoActual-1)" aria-label="Anterior">&#8249;</button><button class="car-btn car-next" onclick="mostrarFoto(fotoActual+1)" aria-label="Siguiente">&#8250;</button>'
                : '';
            const puntos = fotosOk.length > 1
                ? '<div class="car-dots">' + fotosOk.map((_, k) => `<div class="car-dot${k ? '' : ' on'}" onclick="mostrarFoto(${k})"></div>`).join('') + '</div>'
                : '';
            zona.innerHTML = `<div class="carousel"><img id="carImg" src="${fotosOk[0]}" alt="">${flechas}</div>${puntos}`;
            fotoActual = 0;
        }

        function cerrarFicha() {
            document.getElementById('modalBg').classList.remove('open');
            document.body.style.overflow = '';
        }

        const BENEFICIOS_GLOBALES = [];

        function secciones(products) {
            if (currentCategory !== 'all') return [[null, agrupar(products)]];
            const porCat = {};
            products.forEach(p => { (porCat[p.category] = porCat[p.category] || []).push(p); });
            return Object.keys(dataCatalogo)
                .filter(c => porCat[c])
                .map(c => [c, agrupar(porCat[c])]);
        }

        function renderBenefits() {
            const box = document.getElementById('benefitsBox');
            const cats = currentCategory === 'all' ? Object.keys(dataCatalogo) : [currentCategory];
            const conBen = cats.filter(c => dataCatalogo[c] && dataCatalogo[c].beneficios.length);
            let cuerpo = '';
            if (conBen.length) {
                cuerpo += '<div class="ben-title">🎁 Promoción de pago puntual</div>';
                conBen.forEach(c => {
                    if (currentCategory === 'all') cuerpo += `<div class="ben-cat">${c}</div>`;
                    cuerpo += '<div class="ben-chips">' +
                        dataCatalogo[c].beneficios.map(b => `<span class="ben-chip">${b}</span>`).join('') +
                        '</div>';
                });
            }
            if (!BENEFICIOS_GLOBALES.length) { box.innerHTML = cuerpo ? `<div class="ben-box">${cuerpo}</div>` : ''; return; }
            cuerpo += '<div class="ben-title ben-title-2">✅ Aplica para todos los planes</div>' +
                '<div class="ben-chips">' +
                BENEFICIOS_GLOBALES.map(b => `<span class="ben-chip ben-chip-2">${b}</span>`).join('') +
                '</div>';
            box.innerHTML = `<div class="ben-box">${cuerpo}</div>`;
        }

        let currentView = 'table';
        let currentCategory = 'all';
        let currentSearch = '';

        function formatCurrency(value) {
            return new Intl.NumberFormat('es-CO', {
                style: 'currency',
                currency: 'COP',
                minimumFractionDigits: 0
            }).format(value);
        }

        function getAllProducts() {
            let allProducts = [];
            for (let [category, data] of Object.entries(dataCatalogo)) {
                data.productos.forEach(prod => {
                    allProducts.push({
                        ...prod,
                        category: category,
                        ...data
                    });
                });
            }
            return allProducts;
        }

        function filterProducts() {
            let products = getAllProducts();
            if (currentCategory !== 'all') {
                products = products.filter(p => p.category === currentCategory);
            }
            if (currentSearch) {
                const search = currentSearch.toLowerCase();
                products = products.filter(p => p.nombre.toLowerCase().includes(search));
            }
            return products;
        }

        function renderGrid() {
            const products = filterProducts();
            const grid = document.getElementById('productsGrid');
            grid.innerHTML = '';
            if (products.length === 0) {
                document.getElementById('emptyState').classList.remove('hidden');
                grid.classList.add('hidden');
                document.getElementById('productsTable').classList.add('hidden');
                return;
            }
            document.getElementById('emptyState').classList.add('hidden');
            grid.classList.remove('hidden');
            visibles = []; let vi = 0;
            secciones(products).forEach(([cat, grupos]) => {
              if (cat) {
                const ch = document.createElement('div');
                ch.className = 'cat-head';
                ch.textContent = cat;
                grid.appendChild(ch);
              }
              grupos.forEach(([marca, items]) => {
                const h = document.createElement('div');
                h.className = 'brand-head';
                h.textContent = `${marca} · ${items.length} equipo${items.length > 1 ? 's' : ''}`;
                grid.appendChild(h);
                items.forEach(product => {
                    const idx = vi++; visibles.push(product);
                    const card = document.createElement('div');
                    card.className = 'product-card';
                    card.onclick = () => abrirFicha(idx);
                    const chip = product.estado
                        ? `<div class="quincena-badge">${product.estado}</div>` : '';
                    card.innerHTML = `
                        <div class="product-name">${product.nombre}</div>
                        <div class="product-info">
                            <div class="info-row"><span class="info-label">Precio Contado</span><span class="info-value">${formatCurrency(product.precio)}</span></div>
                        </div>
                        ${chip}`;
                    grid.appendChild(card);
                });
              });
            });
            document.getElementById('productCount').textContent = `Mostrando: ${products.length} productos`;
        }

        function renderTable() {
            const products = filterProducts();
            const tableDiv = document.getElementById('productsTable');
            tableDiv.innerHTML = '';
            if (products.length === 0) {
                document.getElementById('emptyState').classList.remove('hidden');
                document.getElementById('productsGrid').classList.add('hidden');
                tableDiv.classList.add('hidden');
                return;
            }
            document.getElementById('emptyState').classList.add('hidden');
            document.getElementById('productsGrid').classList.add('hidden');
            tableDiv.classList.remove('hidden');
            visibles = []; let vi = 0;
            let html = '<table><thead><tr><th>Producto</th><th>Estado</th><th>Precio Contado</th></tr></thead><tbody>';
            secciones(products).forEach(([cat, grupos]) => {
              if (cat) html += `<tr class="cat-row"><td colspan="3">${cat}</td></tr>`;
              grupos.forEach(([marca, items]) => {
                html += `<tr class="brand-row"><td colspan="3">${marca} <span class="brand-count">· ${items.length} equipo${items.length > 1 ? 's' : ''}</span></td></tr>`;
                items.forEach(p => {
                    const idx = vi++; visibles.push(p);
                    html += `<tr onclick="abrirFicha(${idx})"><td>${p.nombre}</td><td>${p.estado || ''}</td><td>${formatCurrency(p.precio)}</td></tr>`;
                });
              });
            });
            html += '</tbody></table>';
            tableDiv.innerHTML = html;
            document.getElementById('productCount').textContent = `Mostrando: ${products.length} productos`;
        }

        function render() {
            renderBenefits();
            if (currentView === 'grid') {
                renderGrid();
            } else {
                renderTable();
            }
        }

        document.getElementById('searchInput').addEventListener('input', (e) => {
            currentSearch = e.target.value;
            render();
        });

        document.querySelectorAll('.tab-btn').forEach(btn => {
            btn.addEventListener('click', (e) => {
                document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
                e.target.classList.add('active');
                currentCategory = e.target.dataset.category;
                render();
            });
        });

        document.getElementById('gridViewBtn').addEventListener('click', () => {
            currentView = 'grid';
            document.querySelectorAll('.view-btn').forEach(b => b.classList.remove('active'));
            document.getElementById('gridViewBtn').classList.add('active');
            render();
        });

        document.getElementById('tableViewBtn').addEventListener('click', () => {
            currentView = 'table';
            document.querySelectorAll('.view-btn').forEach(b => b.classList.remove('active'));
            document.getElementById('tableViewBtn').classList.add('active');
            render();
        });

        document.getElementById('modalBg').addEventListener('click', e => {
            if (e.target.id === 'modalBg') cerrarFicha();
        });
        document.addEventListener('keydown', e => {
            if (e.key === 'Escape') cerrarFicha();
            if (!document.getElementById('modalBg').classList.contains('open') || fotosOk.length < 2) return;
            if (e.key === 'ArrowLeft') mostrarFoto(fotoActual - 1);
            if (e.key === 'ArrowRight') mostrarFoto(fotoActual + 1);
        });

        (function fechaViva() {
            const meses = ['Enero','Febrero','Marzo','Abril','Mayo','Junio',
                           'Julio','Agosto','Septiembre','Octubre','Noviembre','Diciembre'];
            const hoy = new Date();
            document.getElementById('subtitulo').textContent =
                `Precios Contado - ${meses[hoy.getMonth()]} ${hoy.getFullYear()}`;
        })();

        render();
    </script>
