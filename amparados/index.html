        .search-box { flex: 1; min-width: 250px; max-width: 400px; position: relative; }
        .search-box input {
            width: 100%;
            padding: 12px 40px 12px 16px;
            border: 2px solid rgba(255,255,255,0.2);
            border-radius: 10px;
            font-size: 1rem;
            background: rgba(255,255,255,0.95);
            transition: all 0.3s ease;
        }
        .search-box input:focus {
            outline: none;
            border-color: #43e97b;
            box-shadow: 0 0 15px rgba(67,233,123,0.3);
            background: white;
        }
        .search-box i { position: absolute; right: 12px; top: 50%; transform: translateY(-50%); color: #7952B3; pointer-events: none; }
        .category-tabs { display: flex; gap: 10px; flex-wrap: wrap; justify-content: center; margin-bottom: 30px; }
        .tab-btn {
            padding: 12px 20px;
            background: rgba(255,255,255,0.15);
            border: 2px solid rgba(255,255,255,0.3);
            color: white;
            border-radius: 10px;
            cursor: pointer;
            font-weight: 600;
            font-size: 0.95rem;
            transition: all 0.3s ease;
        }
        .tab-btn:hover { background: rgba(255,255,255,0.25); border-color: rgba(255,255,255,0.5); transform: translateY(-2px); }
        .tab-btn.active { background: #43e97b; border-color: #43e97b; color: #5c388e; box-shadow: 0 8px 25px rgba(67,233,123,0.4); }
        .products-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); gap: 20px; margin-bottom: 40px; }
        .product-card {
            background: white;
            border-radius: 12px;
            padding: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.15);
            transition: all 0.3s ease;
            border-left: 5px solid #5c388e;
        }
        .product-card:hover { transform: translateY(-5px); box-shadow: 0 15px 40px rgba(0,0,0,0.2); }
        .product-name { font-size: 1.1rem; font-weight: 700; color: #5c388e; margin-bottom: 12px; line-height: 1.4; }
        .product-info { display: flex; flex-direction: column; gap: 10px; margin-bottom: 15px; font-size: 0.95rem; }
        .info-row { display: flex; justify-content: space-between; padding: 8px 0; border-bottom: 1px solid #f0f0f0; }
        .info-row:last-child { border-bottom: none; }
        .info-label { color: #666; font-weight: 600; }
        .info-value { color: #5c388e; font-weight: 700; text-align: right; }
        .quincena-badge { display: inline-block; background: #43e97b; color: #5c388e; padding: 4px 10px; border-radius: 6px; font-size: 0.85rem; font-weight: 700; margin-top: 8px; }
        .toggle-view { display: flex; gap: 10px; justify-content: center; margin-bottom: 20px; }
        .view-btn { padding: 10px 20px; background: rgba(255,255,255,0.2); border: 2px solid rgba(255,255,255,0.4); color: white; border-radius: 8px; cursor: pointer; font-weight: 600; transition: all 0.3s ease; }
        .view-btn.active { background: white; color: #5c388e; border-color: white; }
        .table-view { background: white; border-radius: 12px; overflow: hidden; box-shadow: 0 10px 30px rgba(0,0,0,0.15); margin-bottom: 40px; }
        .table-view table { width: 100%; border-collapse: collapse; }
        .table-view th { background: linear-gradient(135deg, #5c388e 0%, #7952B3 100%); color: white; padding: 15px; text-align: left; font-weight: 700; border-bottom: 3px solid #5c388e; }
        .table-view td { padding: 12px 15px; border-bottom: 1px solid #e0e0e0; }
        .table-view tr:hover { background: #f5f5f5; }
        .hidden { display: none !important; }
        .modal-bg { position:fixed; inset:0; background:rgba(30,15,55,0.75); display:none; align-items:center; justify-content:center; padding:20px; z-index:100; }
        .modal-bg.open { display:flex; }
        .modal { background:#fff; border-radius:16px; max-width:620px; width:100%; max-height:90vh; overflow-y:auto; padding:26px; position:relative; }
        .modal-close { position:absolute; top:14px; right:16px; background:none; border:none; font-size:1.7rem; color:#8a7aa8; cursor:pointer; line-height:1; padding:0 6px; }
        .modal-close:hover { color:#5c388e; }
        .modal h2 { color:#5c388e; font-size:1.35rem; margin-bottom:4px; padding-right:36px; }
        .modal-cat { color:#8a7aa8; font-size:0.88rem; font-weight:600; margin-bottom:18px; }
        .carousel { position:relative; background:#f4f1f9; border-radius:12px; overflow:hidden; margin-bottom:8px; }
        .carousel img { width:100%; height:300px; object-fit:contain; display:block; background:#f4f1f9; }
        .car-btn { position:absolute; top:50%; transform:translateY(-50%); background:rgba(92,56,142,0.85); color:#fff; border:none; width:36px; height:36px; border-radius:50%; font-size:1.2rem; cursor:pointer; }
        .car-btn:hover { background:#5c388e; }
        .car-prev { left:10px; } .car-next { right:10px; }
        .car-dots { display:flex; justify-content:center; gap:7px; margin-bottom:18px; }
        .car-dot { width:8px; height:8px; border-radius:50%; background:#d6cce6; cursor:pointer; }
        .car-dot.on { background:#5c388e; }
        .no-photo { background:#f4f1f9; border:2px dashed #d6cce6; border-radius:12px; height:190px; display:flex; flex-direction:column; align-items:center; justify-content:center; color:#8a7aa8; font-size:0.9rem; gap:6px; margin-bottom:18px; }
        .no-photo span:first-child { font-size:2rem; }

        .money-card { background:#f4f1f9; border-radius:10px; padding:13px 15px; }

        .money-card .val { font-size:1.22rem; color:#5c388e; font-weight:800; margin-top:3px; }
        .specs-title { font-size:0.95rem; font-weight:700; color:#5c388e; margin-bottom:9px; }
        .specs { width:100%; border-collapse:collapse; font-size:0.9rem; }

        .specs td:last-child { color:#333; font-weight:600; }

        const MARCAS = [['iphone','Apple'],['ipad','Apple'],['honor','Honor'],['infinix','Infinix'],
            ['kalley','Kalley'],['moto','Motorola'],['oppo','Oppo'],['redmi','Xiaomi'],['xiaomi','Xiaomi'],
            ['xioami','Xiaomi'],['samsung','Samsung'],['tecno','Tecno'],['vivo','Vivo'],['zte','ZTE'],['tcl','TCL']];

        function grupoDe(p) {
            return p.grupo || 'Equipos';
        }

        function valorBase(p) { return p.tipo === 'sin_inicial' ? p.monto : p.inicial; }

        function agrupar(products) {
            const g = {};
            products.forEach(p => { const k = grupoDe(p); (g[k] = g[k] || []).push(p); });
            Object.values(g).forEach(arr => arr.sort((a, b) => valorBase(a) - valorBase(b)));
            const orden = ['Exhibición', 'Nuevos'];
            return Object.keys(g)
                .sort((a, b) => orden.indexOf(a) - orden.indexOf(b))
                .map(k => [k, g[k]]);
        }

        function slug(nombre) {
            return nombre.toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g, '')
                .replace(/["']/g, '').replace(/[^a-z0-9]+/g, '-').replace(/^-|-$/g, '');
        }

        // El nombre de la foto sale del equipo fisico, no del SKU: un iPhone 17 Pro Max
        // se ve igual con 256 o 512 GB, nuevo o usado. Asi una sola foto sirve para
        // todas sus variantes y para todos los catalogos.
        function slugFoto(nombre) {
            // Quita almacenamiento, RAM y estado. El Excel los escribe de varias
            // formas ("128GB 4GB RAM", "128GB/4RAM", "4GB/128GB", "256GB/12+12RAM"),
            // y todas deben llegar al mismo nombre de archivo para compartir la foto.
            return slug(nombre.replace(/\s*[\d+]+\s*(GB|TB)\b/gi, ' ')
                              .replace(/\s*[\d+]+\s*RAM\b/gi, ' ')
                              .replace(/[\/+]/g, ' ')
                              .replace(/\s*\b(Nuevo|Usado)\b/gi, ' ')
                              .trim());
        }

        // Carpeta unica de imagenes en la raiz del repositorio. Funciona igual desde
        // la raiz o desde cualquier subcarpeta (/amparados/, /contado/, ...).
        const IMG_BASE = location.pathname.split('/')[1]
            ? '/' + location.pathname.split('/')[1] + '/img/'
            : 'img/';

        let visibles = [];
        let fotoActual = 0;
        let fotosOk = [];

        function mostrarFoto(i) {
            fotoActual = (i + fotosOk.length) % fotosOk.length;
            const img = document.getElementById('carImg');
            if (img) img.src = fotosOk[fotoActual];
            document.querySelectorAll('.car-dot').forEach((d, k) => d.className = 'car-dot' + (k === fotoActual ? ' on' : ''));
        }

        function abrirFicha(idx) {
            const p = visibles[idx];
            if (!p) return;
            const s = slugFoto(p.nombre);
            const etiqueta = p.tipo === 'sin_inicial' ? 'Monto máximo' : 'Cuota inicial';

            let specsHTML = '<div class="specs-pend">Características por confirmar</div>';
            if (p.specs && Object.keys(p.specs).length) {
                specsHTML = '<table class="specs">' + Object.entries(p.specs)
                    .map(([k, v]) => `<tr><td>${k}</td><td>${v}</td></tr>`).join('') + '</table>';
            }

            document.getElementById('modalBox').innerHTML = `
                <button class="modal-close" onclick="cerrarFicha()" aria-label="Cerrar">&times;</button>
                <h2>${p.nombre}</h2>
                <div class="modal-cat">${p.category} · ${p.quincenas} quincenas</div>
                <div id="fotoZona"><div class="no-photo"><span>📷</span><span>Fotos pendientes</span></div></div>
                <div class="modal-money">
                    <div class="money-card"><div class="lbl">${etiqueta}</div><div class="val">${formatCurrency(valorBase(p))}</div></div>
                    <div class="money-card"><div class="lbl">Cuota quincenal</div><div class="val">${formatCurrency(p.cuota)}</div></div>
                </div>
                <div class="specs-title">Características</div>
                ${specsHTML}`;

            document.getElementById('modalBg').classList.add('open');
            document.body.style.overflow = 'hidden';

            fotosOk = [];
            const EXT = ['jpg', 'jpeg', 'png', 'webp', 'JPG', 'PNG'];
            const hallazgos = {};
            let faltan = 3;

            function slotListo() {
                if (--faltan) return;
                fotosOk = [1, 2, 3].map(n => hallazgos[n]).filter(Boolean);
                pintarCarrusel();
            }

            [1, 2, 3].forEach(n => {
                let e = 0;
                (function probar() {
                    if (e >= EXT.length) return slotListo();
                    const ruta = `${IMG_BASE}${s}-${n}.${EXT[e++]}`;
                    const test = new Image();
                    test.onload = () => { hallazgos[n] = ruta; slotListo(); };
                    test.onerror = probar;
                    test.src = ruta;
                })();
            });
        }

        function pintarCarrusel() {
            if (!fotosOk.length) return;
            const zona = document.getElementById('fotoZona');
            if (!zona) return;
            const flechas = fotosOk.length > 1
                ? '<button class="car-btn car-prev" onclick="mostrarFoto(fotoActual-1)" aria-label="Anterior">&#8249;</button><button class="car-btn car-next" onclick="mostrarFoto(fotoActual+1)" aria-label="Siguiente">&#8250;</button>'
                : '';
            const puntos = fotosOk.length > 1
                ? '<div class="car-dots">' + fotosOk.map((_, k) => `<div class="car-dot${k ? '' : ' on'}" onclick="mostrarFoto(${k})"></div>`).join('') + '</div>'
                : '';
            zona.innerHTML = `<div class="carousel"><img id="carImg" src="${fotosOk[0]}" alt="">${flechas}</div>${puntos}`;
            fotoActual = 0;
        }

        function cerrarFicha() {
            document.getElementById('modalBg').classList.remove('open');
            document.body.style.overflow = '';
        }

        const BENEFICIOS_GLOBALES = ["Aplica para reportados", "Aplica sin vida crediticia", "Aplica para venezolanos con PPT"];

        function secciones(products) {
            if (currentCategory !== 'all') return [[null, agrupar(products)]];
            const porCat = {};
            products.forEach(p => { (porCat[p.category] = porCat[p.category] || []).push(p); });
            return Object.keys(dataCatalogo)
                .filter(c => porCat[c])
                .map(c => [c, agrupar(porCat[c])]);
        }

        function renderBenefits() {
            const box = document.getElementById('benefitsBox');
            const cats = currentCategory === 'all' ? Object.keys(dataCatalogo) : [currentCategory];
            const conBen = cats.filter(c => dataCatalogo[c] && dataCatalogo[c].beneficios.length);
            let cuerpo = '';
            if (conBen.length) {
                cuerpo += '<div class="ben-title">🎁 Promoción de pago puntual</div>';
                conBen.forEach(c => {
                    if (currentCategory === 'all') cuerpo += `<div class="ben-cat">${c}</div>`;
                    cuerpo += '<div class="ben-chips">' +
                        dataCatalogo[c].beneficios.map(b => `<span class="ben-chip">${b}</span>`).join('') +
                        '</div>';
                });
            }
            cuerpo += '<div class="ben-title ben-title-2">✅ Condiciones de este plan</div>' +
                '<div class="ben-chips">' +
                BENEFICIOS_GLOBALES.map(b => `<span class="ben-chip ben-chip-2">${b}</span>`).join('') +
                '</div>';
            box.innerHTML = `<div class="ben-box">${cuerpo}</div>`;
        }

        let currentView = 'table';
        let currentCategory = 'all';
        let currentSearch = '';

        function formatCurrency(value) {
            return new Intl.NumberFormat('es-CO', {
                style: 'currency',
                currency: 'COP',
                minimumFractionDigits: 0
            }).format(value);
        }

        function getAllProducts() {
            let allProducts = [];
            for (let [category, data] of Object.entries(dataCatalogo)) {
                data.productos.forEach(prod => {
                    allProducts.push({
                        ...prod,
                        category: category,
                        ...data
                    });
                });
            }
            return allProducts;
        }

        function filterProducts() {
            let products = getAllProducts();
            if (currentCategory !== 'all') {
                products = products.filter(p => p.category === currentCategory);
            }
            if (currentSearch) {
                const search = currentSearch.toLowerCase();
                products = products.filter(p => p.nombre.toLowerCase().includes(search));
            }
            return products;
        }

        function renderGrid() {
            const products = filterProducts();
            const grid = document.getElementById('productsGrid');
            grid.innerHTML = '';
            if (products.length === 0) {
                document.getElementById('emptyState').classList.remove('hidden');
                grid.classList.add('hidden');
                document.getElementById('productsTable').classList.add('hidden');
                return;
            }
            document.getElementById('emptyState').classList.add('hidden');
            grid.classList.remove('hidden');
            visibles = []; let vi = 0;
            secciones(products).forEach(([cat, grupos]) => {
              if (cat) {
                const ch = document.createElement('div');
                ch.className = 'cat-head';
                ch.textContent = cat;
                grid.appendChild(ch);
              }
              grupos.forEach(([marca, items]) => {
                const h = document.createElement('div');
                h.className = 'brand-head';
                h.textContent = `${marca} · ${items.length} equipo${items.length > 1 ? 's' : ''}`;
                grid.appendChild(h);
                items.forEach(product => {
                    const idx = vi++; visibles.push(product);
                    const card = document.createElement('div');
                    card.className = 'product-card';
                    card.onclick = () => abrirFicha(idx);
                    const etiqueta = product.tipo === 'sin_inicial' ? 'Monto Máximo a Financiar' : 'Cuota Inicial';
                    card.innerHTML = `
                        <div class="product-name">${product.nombre}</div>
                        <div class="product-info">
                            <div class="info-row"><span class="info-label">${etiqueta}</span><span class="info-value">${formatCurrency(valorBase(product))}</span></div>
                            <div class="info-row"><span class="info-label">Cuota ${product.quincenas}Q</span><span class="info-value">${formatCurrency(product.cuota)}</span></div>
                        </div>
                        <div class="quincena-badge">${product.quincenas} quincenas</div>`;
                    grid.appendChild(card);
                });
              });
            });
            document.getElementById('productCount').textContent = `Mostrando: ${products.length} productos`;
        }

        function renderTable() {
            const products = filterProducts();
            const tableDiv = document.getElementById('productsTable');
            tableDiv.innerHTML = '';
            if (products.length === 0) {
                document.getElementById('emptyState').classList.remove('hidden');
                document.getElementById('productsGrid').classList.add('hidden');
                tableDiv.classList.add('hidden');
                return;
            }
            document.getElementById('emptyState').classList.add('hidden');
            document.getElementById('productsGrid').classList.add('hidden');
            tableDiv.classList.remove('hidden');
            visibles = []; let vi = 0;
            const colValor = products[0].tipo === 'sin_inicial'
                ? 'Monto Máximo a Financiar' : 'Cuota Inicial';
            let html = `<table><thead><tr><th>Producto</th><th>${colValor}</th><th>Cuota Quincena</th><th>Plazo</th></tr></thead><tbody>`;
            secciones(products).forEach(([cat, grupos]) => {
              if (cat) html += `<tr class="cat-row"><td colspan="4">${cat}</td></tr>`;
              grupos.forEach(([marca, items]) => {
                html += `<tr class="brand-row"><td colspan="4">${marca} <span class="brand-count">· ${items.length} equipo${items.length > 1 ? 's' : ''}</span></td></tr>`;
                items.forEach(p => {
                    const idx = vi++; visibles.push(p);
                    html += `<tr onclick="abrirFicha(${idx})"><td>${p.nombre}</td><td>${formatCurrency(valorBase(p))}</td><td>${formatCurrency(p.cuota)}</td><td>${p.quincenas}Q</td></tr>`;
                });
              });
            });
            html += '</tbody></table>';
            tableDiv.innerHTML = html;
            document.getElementById('productCount').textContent = `Mostrando: ${products.length} productos`;
        }

        function render() {
            renderBenefits();
            if (currentView === 'grid') {
                renderGrid();
            } else {
                renderTable();
            }
        }

        document.getElementById('searchInput').addEventListener('input', (e) => {
            currentSearch = e.target.value;
            render();
        });

        document.querySelectorAll('.tab-btn').forEach(btn => {
            btn.addEventListener('click', (e) => {
                document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
                e.target.classList.add('active');
                currentCategory = e.target.dataset.category;
                render();
            });
        });

        document.getElementById('gridViewBtn').addEventListener('click', () => {
            currentView = 'grid';
            document.querySelectorAll('.view-btn').forEach(b => b.classList.remove('active'));
            document.getElementById('gridViewBtn').classList.add('active');
            render();
        });

        document.getElementById('tableViewBtn').addEventListener('click', () => {
            currentView = 'table';
            document.querySelectorAll('.view-btn').forEach(b => b.classList.remove('active'));
            document.getElementById('tableViewBtn').classList.add('active');
            render();
        });

        document.getElementById('modalBg').addEventListener('click', e => {
            if (e.target.id === 'modalBg') cerrarFicha();
        });
        document.addEventListener('keydown', e => {
            if (e.key === 'Escape') cerrarFicha();
            if (!document.getElementById('modalBg').classList.contains('open') || fotosOk.length < 2) return;
            if (e.key === 'ArrowLeft') mostrarFoto(fotoActual - 1);
            if (e.key === 'ArrowRight') mostrarFoto(fotoActual + 1);
        });

        (function fechaViva() {
            const meses = ['Enero','Febrero','Marzo','Abril','Mayo','Junio',
                           'Julio','Agosto','Septiembre','Octubre','Noviembre','Diciembre'];
            const hoy = new Date();
            document.getElementById('subtitulo').textContent =
                `Catálogo Amparados - ${meses[hoy.getMonth()]} ${hoy.getFullYear()}`;
        })();

        render();
    </script>
