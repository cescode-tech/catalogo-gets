        }

            min-width: 250px;

            position: relative;
        }

        .search-box input {
            width: 100%;
            padding: 12px 40px 12px 16px;
            border: 2px solid rgba(255,255,255,0.2);
            border-radius: 10px;
            font-size: 1rem;
            background: rgba(255,255,255,0.95);
            backdrop-filter: blur(10px);
            transition: all 0.3s ease;
        }

        .search-box input:focus {
            outline: none;
            border-color: #43e97b;
            box-shadow: 0 0 15px rgba(67,233,123,0.3);
            background: white;
        }

        .search-box i {
            position: absolute;
            right: 12px;
            top: 50%;
            transform: translateY(-50%);
            color: #7952B3;
            pointer-events: none;
        }

        .category-tabs {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            justify-content: center;
            margin-bottom: 30px;
        }

        .tab-btn {
            padding: 12px 20px;
            background: rgba(255,255,255,0.15);
            border: 2px solid rgba(255,255,255,0.3);
            color: white;
            border-radius: 10px;
            cursor: pointer;
            font-weight: 600;
            font-size: 0.95rem;
            transition: all 0.3s ease;
            backdrop-filter: blur(10px);
        }

        .tab-btn:hover {
            background: rgba(255,255,255,0.25);
            border-color: rgba(255,255,255,0.5);
            transform: translateY(-2px);
        }

        .tab-btn.active {
            background: #43e97b;
            border-color: #43e97b;
            color: #5c388e;
            box-shadow: 0 8px 25px rgba(67,233,123,0.4);
        }

        .products-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
            gap: 20px;
            margin-bottom: 40px;
        }

        .product-card {
            background: white;
            border-radius: 12px;
            padding: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.15);
            transition: all 0.3s ease;
            border-left: 5px solid #5c388e;
            animation: slideUp 0.4s ease-out;
        }

        @keyframes slideUp {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .product-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 15px 40px rgba(0,0,0,0.2);
        }

        .product-name {
            font-size: 1.1rem;
            font-weight: 700;
            color: #5c388e;
            margin-bottom: 12px;
            line-height: 1.4;
        }

        .info-value {
            color: #5c388e;
            font-weight: 700;
            text-align: right;

            padding: 4px 10px;

            font-size: 0.85rem;

            background: white;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 10px 30px rgba(0,0,0,0.15);
            margin-bottom: 40px;
        }

            width: 100%;

        }

            background: linear-gradient(135deg, #5c388e 0%, #7952B3 100%);

            padding: 15px;

            padding: 12px 15px;

            gap: 10px;
            justify-content: center;
            margin-bottom: 20px;

            border-radius: 8px;

        let currentView = 'grid';

        function formatCurrency(value) {
            return new Intl.NumberFormat('es-CO', {
                style: 'currency',
                currency: 'COP',
                minimumFractionDigits: 0
            }).format(value);
        }

        function getAllProducts() {
            let allProducts = [];
            for (let [category, data] of Object.entries(dataCatalogo)) {
                data.productos.forEach(prod => {
                    allProducts.push({
                        ...prod,
                        category: category,
                        ...data
                    });
                });
            }
            return allProducts;
        }

        function filterProducts() {
            let products = getAllProducts();

            if (currentCategory !== 'all') {
                products = products.filter(p => p.category === currentCategory);
            }

            if (currentSearch) {
                const search = currentSearch.toLowerCase();
                products = products.filter(p => p.nombre.toLowerCase().includes(search));
            }

            return products;
        }

        function renderGrid() {
            const products = filterProducts();
            const grid = document.getElementById('productsGrid');
            grid.innerHTML = '';

            if (products.length === 0) {
                document.getElementById('emptyState').classList.remove('hidden');
                grid.classList.add('hidden');
                document.getElementById('productsTable').classList.add('hidden');
                return;
            }

            document.getElementById('emptyState').classList.add('hidden');
            grid.classList.remove('hidden');

                const card = document.createElement('div');

                    `;
                } else {
                    infoHTML = `
                        <div class="info-row">
                            <span class="info-label">Cuota Inicial</span>
                            <span class="info-value">${formatCurrency(product.inicial)}</span>
                        </div>
                        <div class="info-row">
                            <span class="info-label">Cuota ${product.quincenas}Q</span>
                            <span class="info-value">${formatCurrency(product.cuota)}</span>
                        </div>
                    `;
                }

                let benefitsHTML = '';
                if (product.beneficios && product.beneficios.length > 0) {
                    benefitsHTML = `
                        <div class="benefits">
                            <strong>✨ Beneficios:</strong><br>
                            ${product.beneficios.map(b => `• ${b}`).join('<br>')}
                        </div>
                    `;
                }

                card.innerHTML = `
                    <div class="product-name">${product.nombre}</div>
                    <div class="product-info">${infoHTML}</div>
                    <div class="quincena-badge">${product.quincenas} quincenas</div>
                    ${benefitsHTML}
                `;
                grid.appendChild(card);
            });

            document.getElementById('productCount').textContent = `Mostrando: ${products.length} productos`;
        }

        function renderTable() {
            const products = filterProducts();
            const tableDiv = document.getElementById('productsTable');
            tableDiv.innerHTML = '';

            if (products.length === 0) {
                document.getElementById('emptyState').classList.remove('hidden');
                document.getElementById('productsGrid').classList.add('hidden');
                tableDiv.classList.add('hidden');
                return;
            }

            document.getElementById('emptyState').classList.add('hidden');
            document.getElementById('productsGrid').classList.add('hidden');
            tableDiv.classList.remove('hidden');

            const headers = ['Producto', 'Categoría', 'Cuotas', 'Inicial/Monto', 'Cuota Q', 'Beneficios'];
            let html = '<table><thead><tr>';
            headers.forEach(h => html += `<th>${h}</th>`);
            html += '</tr></thead><tbody>';

            products.forEach(product => {
                const montoLabel = product.tipo === 'sin_inicial' ? 'Monto' : 'Inicial';
                const montoValue = product.tipo === 'sin_inicial' ? product.monto : product.inicial;
                const benefits = product.beneficios ? product.beneficios.join(' | ') : 'Sin beneficios especiales';

                html += `
                    <tr>
                        <td>${product.nombre}</td>
                        <td>${product.category}</td>
                        <td>${product.quincenas}Q</td>
                        <td>${formatCurrency(montoValue)}</td>
                        <td>${formatCurrency(product.cuota)}</td>
                        <td>${benefits}</td>
                    </tr>
                `;
            });

            html += '</tbody></table>';
            tableDiv.innerHTML = html;
            document.getElementById('productCount').textContent = `Mostrando: ${products.length} productos`;
        }

        function render() {
            if (currentView === 'grid') {
                renderGrid();
            } else {
                renderTable();
            }
        }

        document.getElementById('searchInput').addEventListener('input', (e) => {
            currentSearch = e.target.value;
            render();
        });

        document.querySelectorAll('.tab-btn').forEach(btn => {
            btn.addEventListener('click', (e) => {
                document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
                e.target.classList.add('active');
                currentCategory = e.target.dataset.category;
                render();
            });
        });

        document.getElementById('gridViewBtn').addEventListener('click', () => {
            currentView = 'grid';
            document.querySelectorAll('.view-btn').forEach(b => b.classList.remove('active'));
            document.getElementById('gridViewBtn').classList.add('active');
            render();
        });

        document.getElementById('tableViewBtn').addEventListener('click', () => {
            currentView = 'table';
            document.querySelectorAll('.view-btn').forEach(b => b.classList.remove('active'));
            document.getElementById('tableViewBtn').classList.add('active');
            render();
        });

        render();
    </script>
</body>
</html>
